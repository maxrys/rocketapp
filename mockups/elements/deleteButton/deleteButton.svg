<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:bx="https://boxy-svg.com">
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="40" y2="80" id="gradient-0">
      <stop offset="0" style="stop-color: rgb(228, 91, 67);"/>
      <stop offset="1" style="stop-color: rgb(191, 32, 6);"/>
    </linearGradient>
    <filter id="drop-shadow-filter-0" bx:preset="drop-shadow 1 0 3 4 0.57 #000000d1" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="1.14"/>
      </feComponentTransfer>
      <feFlood flood-color="#000000d1"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <bx:export>
      <bx:file format="png" path="deleteButton.png" antialiasing="true"/>
    </bx:export>
  </defs>
  <g style="filter: url(&quot;#drop-shadow-filter-0&quot;);" transform="matrix(1, 0, 0, 1, 10, 10)">
    <ellipse style="fill: url(&quot;#gradient-0&quot;);" cx="40" cy="40" rx="40" ry="40"/>
    <line style="fill: none; stroke-linecap: round; stroke: rgb(255, 255, 255); stroke-width: 6px;" x1="22.006" y1="40" x2="57.994" y2="40"/>
  </g>
</svg>